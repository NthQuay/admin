<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6F0; --card:#FFFFFF; --ink:#3B322C; --muted:#8C8077; --line:#EEE5DA;
  --soft:#F5EEE6; --rose:#D4587F; --rose-soft:#FBE9EF; --gold:#B8893A; --gold-soft:#F8EFD9;
  --sage:#6E9C84; --sage-soft:#E6F1EA; --amber:#C98A2B; --amber-soft:#FBF0DA;
  --tt:#2B2B2B; --ig:#D6478F; --fb:#4A7BC8;
  --shadow:0 2px 14px rgba(120,90,60,.07);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1F1A17; --card:#2A2420; --ink:#F1E9E0; --muted:#A99D93; --line:#3A322D; --soft:#332B26;
    --rose:#F07FA3; --rose-soft:#44252F; --gold:#E3B866; --gold-soft:#3F3320; --sage:#8CC2A6; --sage-soft:#243329;
    --amber:#E8B35C; --amber-soft:#3F3320; --tt:#EDEDED; --ig:#F06BAE; --fb:#7FA6E8; --shadow:none;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:11.8px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:max(20.7px,env(safe-area-inset-top)) 13.3px 66.5px}
header h1{font:700 clamp(22.2px,5vw,31.1px)/1.1 "Cormorant Garamond",Georgia,serif;margin:0;color:var(--rose);letter-spacing:.2px}
header p{margin:6px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:7.4px;margin:22px 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8.9px 10.4px;box-shadow:var(--shadow)}
.stat b{display:block;font:700 19.2px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--ink)}
.stat span{font-size:10px;color:var(--muted)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:99px;transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:5.9px;align-items:center;margin:10px 0 18px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5.2px 10.4px;border-radius:99px;font:500 10.4px Inter,sans-serif;cursor:pointer}
.pill.on{background:var(--rose);border-color:var(--rose);color:#fff}
.spacer{flex:1}
.ghost{background:none;border:1px dashed var(--line);color:var(--muted);padding:4.4px 8.9px;border-radius:10px;font:500 10px Inter,sans-serif;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

details.post{background:var(--card);border:1px solid var(--line);border-radius:20px;margin:0 0 14px;box-shadow:var(--shadow);overflow:hidden}
details.post.done{border-color:var(--sage)}
summary{list-style:none;cursor:pointer;display:flex;gap:10.4px;align-items:center;padding:11.8px 13.3px}
summary::-webkit-details-marker{display:none}
.num{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--rose-soft);color:var(--rose);font:700 14.8px "Cormorant Garamond",Georgia,serif}
.done .num{background:var(--sage-soft);color:var(--sage)}
.ttl{flex:1;min-width:0}
.ttl h2{margin:0;font:700 clamp(15.5px,3.4vw,19.2px)/1.15 "Cormorant Garamond",Georgia,serif;color:var(--rose)}
.chips{display:flex;gap:4.4px;margin-top:6px;flex-wrap:wrap}
.chip{font-size:10px;font-weight:600;padding:1.5px 6.7px;border-radius:99px;background:var(--soft);color:var(--muted);letter-spacing:.2px}
.chip.posted{background:var(--sage-soft);color:var(--sage)}
.chip.sched{background:var(--amber-soft);color:var(--amber)}
.chip.draft{background:var(--gold-soft);color:var(--gold)}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip .lg{width:14px;height:14px;display:block}
.chip.made{background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff;font-weight:700;box-shadow:0 1px 5px rgba(109,40,217,.35)}
.chev{color:var(--muted);transition:transform .2s;font-size:13.3px}
details.post[open] > summary .chev{transform:rotate(180deg)}
.body{padding:1.5px 13.3px 14.8px;border-top:1px solid var(--line)}
.sec{margin-top:20px}
.sec h3{margin:0 0 8px;font:600 10px Inter,sans-serif;letter-spacing:.9px;text-transform:uppercase;color:var(--gold)}
.row{display:flex;gap:7.4px;align-items:flex-start}
.copy{flex:none;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:10px;padding:4.4px 8.1px;font:600 10px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.copy:hover{background:var(--rose-soft);border-color:var(--rose);color:var(--rose)}
.copy.ok{background:var(--sage-soft);border-color:var(--sage);color:var(--sage)}
.titlebox{background:var(--rose-soft);border-radius:14px;padding:8.9px 10.4px;align-items:center;justify-content:space-between}
.titlebox strong{font:700 14.8px "Cormorant Garamond",Georgia,serif;color:var(--rose)}
.created{display:flex;gap:7.4px;align-items:center;margin-top:12px;font-weight:600}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--sage);flex:none;cursor:pointer;margin:2px 0 0}
.slide{display:flex;gap:8.9px;align-items:flex-start;padding:8.1px 8.9px;border-radius:14px;background:var(--soft);margin-bottom:8px}
.slide.checked{opacity:.62}
.slide.checked .st{text-decoration:line-through;text-decoration-color:var(--muted)}
.sn{font:600 10px Inter;color:var(--gold);letter-spacing:.6px;text-transform:uppercase}
.st{flex:1;min-width:0}
.st b{font-weight:600}
.plug{font-size:10px;font-weight:600;background:var(--gold-soft);color:var(--gold);padding:0.7px 5.9px;border-radius:99px;margin-left:6px;white-space:nowrap}
.slide label{display:flex;gap:8.9px;flex:1;cursor:pointer;min-width:0}
textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8.1px 9.6px;font:11.5px/1.55 Inter,sans-serif}
textarea[readonly]{background:var(--soft);border-color:transparent;cursor:default}
textarea:focus{outline:2px solid var(--rose);outline-offset:1px}
.btns{display:flex;gap:5.9px;margin-top:8px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:5.2px 10.4px;font:600 10px Inter,sans-serif;cursor:pointer}
.btn.save{background:var(--rose);color:#fff}
.btn.edit{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.lnk{background:none;color:var(--muted);font-weight:500;text-decoration:underline}
.plat{display:flex;flex-wrap:wrap;gap:7px 12px;align-items:center;padding:8.9px;border-radius:14px;background:var(--soft);margin-bottom:8px}
.pn{font-weight:700;display:flex;align-items:center;gap:5.9px;width:84px;flex:none}
.dot{width:10px;height:10px;border-radius:50%}
.seg{justify-self:start;display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:none;background:none;padding:5.2px 9.6px;font:600 10px Inter,sans-serif;color:var(--muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.d{background:var(--gold);color:#fff}
.seg button.on.p{background:var(--sage);color:#fff}
.seg button.on.s{background:var(--amber);color:#fff}
.when{display:flex;gap:5.9px;flex-wrap:wrap;align-items:center;font-size:10px;color:var(--muted)}
.when input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:3.5px 6px;font:12px Inter,sans-serif}
.due{color:#fff;background:var(--rose);border-radius:99px;padding:0.7px 6.7px;font-size:10px;font-weight:600}
.toast{z-index:60;position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:7.4px 13.3px;border-radius:99px;font-weight:600;font-size:10.4px;opacity:0;pointer-events:none;transition:.25s;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--muted);padding:29.6px 0}
@media(max-width:560px){
  .row.wrap-m{flex-direction:column}
  summary{padding:10.4px}
}

.dots{display:flex;gap:3.7px;margin-top:8px}
.dots i{width:22px;height:5px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--sage)}
.slist{margin-top:8px;background:var(--soft);border-radius:16px;overflow:hidden}
.srow{display:flex;gap:8.9px;align-items:center;padding:8.1px 10.4px;cursor:pointer;transition:background .15s}
.srow+.srow{border-top:1px solid var(--line)}
.srow:hover{background:var(--rose-soft)}
.srow.checked .sh,.srow.checked .sno{opacity:.45}
.sno{flex:none;width:20px;height:20px;border-radius:50%;background:var(--card);color:var(--gold);font:700 10px Inter;display:grid;place-items:center}
.sh{flex:1;min-width:0;font:400 11.1px/1.4 Inter,system-ui,sans-serif;color:var(--ink)}
.go{color:var(--rose);font-size:17.8px;line-height:1}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:10.4px}
.modal[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(59,50,44,.45);backdrop-filter:blur(3px)}
.mcard{position:relative;width:min(640px,100%);max-height:calc(100dvh - 28px);overflow:auto;background:var(--card);border-radius:24px;padding:13.3px 11.8px 11.8px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mtop{display:flex;justify-content:space-between;gap:7.4px;align-items:flex-start;padding:0 3px}
.mcar{font:600 10px Inter;color:var(--gold);letter-spacing:.3px}
.mof{font:700 16.3px "Cormorant Garamond",Georgia,serif;color:var(--rose);margin-top:2px}

 {id:'0',t:'5 Guest List & RSVP Etiquette Tips for your Wedding',
  s:[
   ['5 Guest List & RSVP Etiquette Tips for your Wedding','Plus-ones, A-lists and RSVP deadlines — sorted without the awkwardness.','cover'],
   ['Set clear plus-one rules early.','Decide upfront if plus-ones apply only to married, engaged, or long-term couples to keep your numbers fair and consistent.'],

   ['Automate your RSVP tracking.','Ditch paper spreadsheets and track dietary needs, plus-ones, and responses automatically with a free wedding website on UnionVault.app.'],
   ['Follow up firmly after the deadline.','Give late responders 48 hours to confirm before marking them as declined so your seating plan isn\'t held up.']],
  d:'Plus-ones, A-lists, RSVP chasing… the guest list is where wedding planning gets awkward fast. 💌\n\nSwipe for 5 etiquette rules that keep it drama-free, then let UnionVault do the chasing: track RSVPs, dietary needs and plus-ones in one place.\n\nStart free at unionvault.app',

 {id:'1',t:'5 Seating Chart & Floorplan Strategy Tips for your Wedding',

  h:'#unionvault #weddingplanning #australianwedding #seatingchart #weddingreception'},
 {id:'12',t:'5 Tips for Planning Small & Intimate Weddings',
  s:[
   ['5 Tips for Planning an Intimate Wedding','Less stress, more meaning, and a celebration that actually feels like you.','cover'],
   ['Be ruthless with your guest list.','Only invite people who are actively part of your life right now. If you haven\'t spoken in the last year, they don\'t need a seat at a 30-person dinner.'],
   ['Upgrade the guest experience.','With fewer heads to feed, reallocate your budget toward a multi-course dining experience, elevated wines, or custom welcome notes at every place setting.'],

   ['Factor in service charges and GST.','Always ask vendors whether their quoted price includes taxes, delivery fees, and setup surcharges before signing.'],

   ['Ask about corkage and cake-cutting fees.','Bringing your own alcohol or external wedding cake often triggers per-head venue charges.'],

  d:'The quote isn\'t the final price. 💸\n\nSwipe for 5 ways to dodge hidden wedding fees (hello, corkage and cake-cutting charges). Then keep every deposit, invoice and due date in one place with UnionVault — start free at unionvault.app',

   ['Compare at least three quotes per category.','Reviewing multiple suppliers helps you understand fair market pricing and spot what is missing from basic packages.'],

   ['Ask who will actually work your wedding.','For larger photography studios or bands, confirm whether the person you meet is the person showing up on the day.'],

const KEY='uv-carousel-tracker-v1';
let S; try{ S=JSON.parse(localStorage.getItem(KEY))||{} }catch(e){ S={} }
S.posts = S.posts || {};
function migrateData(o){
  if(!o||o.cover1) return o;
  o.posts=o.posts||{};
  for(let k=0;k<12;k++){ const p=o.posts[String(k)]; if(!p) continue;
    const old=p.slides||{}, ns={};
    Object.keys(old).forEach(n=>{ if(old[n]) ns[+n+1]=true });
    if(p.created) for(let n=0;n<6;n++) ns[n]=true;
    p.slides=ns; }
  o.cover1=true; return o;
}
migrateData(S);
let memoryOnly=false;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){ if(!memoryOnly){memoryOnly=true; toast('Browser storage unavailable — changes won\'t persist')} } }
function P(i){
  const id=POSTS[i].id; const p = S.posts[id] = S.posts[id] || {};
  p.open ??= false; p.created ??= false; p.slides ??= {}; p.plat ??= {};
  PLATS.forEach(x=>{ p.plat[x.k] ??= {st:'none',date:'',time:''} });
  p.platOpen ??= false;
  if(p.created && !POSTS[i].s.every((_,k)=>p.slides[k])) POSTS[i].s.forEach((_,k)=>p.slides[k]=true);
  return p;
}
const editing={}, drafts={};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function todayISO(){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10) }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return new Date(y,m-1,d).toLocaleDateString('en-AU',{day:'numeric',month:'short'}) }
function fmtTime(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); return ((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm') }
function platSummary(i){
  const p=P(i);
  return PLATS.map(x=>{ const pl=p.plat[x.k]; let c='none',t='Not set';
    if(pl.st==='draft'){c='draft';t='Drafted'}

    else if(pl.st==='sched'){c='sched';t='Scheduled'+(pl.date?' '+fmtDate(pl.date):'')+(pl.time?', '+fmtTime(pl.time):'')+(isDue(pl)?' – due now':'')}
    return `<span class="ps ${c}"><span class="pnm">${x.n}:</span> ${t}</span>`;

/* ---------- copy ---------- */
const ICO_COPY='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>';
const ICO_OK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
async function copyText(text, btn){
  try{ await navigator.clipboard.writeText(text) }
  catch(e){ const t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.opacity=0; document.body.appendChild(t); t.select(); try{document.execCommand('copy')}catch(_){} t.remove() }
  if(btn){ const o=btn.innerHTML, ic=btn.classList.contains('copy')&&btn.querySelector('svg'); btn.classList.add('ok'); btn.innerHTML= ic ? ICO_OK+(btn.dataset.lbl?'<span>Copied</span>':'') : '✓ Copied'; setTimeout(()=>{btn.classList.remove('ok'); btn.innerHTML=o},1400) }
  toast('Copied to clipboard');
}
let tt; function toast(m){ const e=document.getElementById('toast'); e.textContent=m; e.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('show'),1500) }

    <button class="copy ic" data-a="copybox" data-i="${i}" data-k="${kind}" aria-label="Copy ${label.toLowerCase()}" title="Copy">${ICO_COPY}</button></div>
    <textarea data-box="${key}" ${ed?'':'readonly'} rows="${kind==='d'?5:3}" style="margin-top:8px">${esc(val)}</textarea>
    <div class="btns">
      ${ed?`<button class="btn save" data-a="savebox" data-i="${i}" data-k="${kind}">Save</button><button class="btn lnk" data-a="cancelbox" data-i="${i}" data-k="${kind}">Cancel</button>`

function slideNo(i,n){ return POSTS[i].s[n][2]==='cover' ? '★' : n+1-cov(i) }
function slideShort(i,n){ return POSTS[i].s[n][2]==='cover' ? 'Cover' : 'Slide '+(n+1-cov(i)) }

function dots(i){ const p=P(i); return '<div class="dots">'+POSTS[i].s.map((_,n)=>`<i class="${p.slides[n]?'on':''}"></i>`).join('')+'</div>' }
const LOGO={
 tt:'<svg class="lg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.5 3c.3 2.3 1.7 3.9 4 4.1v3.2c-1.5 0-2.9-.5-4-1.3v6.1a6.1 6.1 0 1 1-6.1-6.1c.3 0 .7 0 1 .1v3.3a2.9 2.9 0 1 0 2 2.7V3h3.1z"/></svg>',
 ig:'<svg class="lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="17.3" cy="6.7" r="1.3" fill="currentColor"/></svg>',
 fb:'<svg class="lg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13.6 21v-8h2.7l.5-3.2h-3.2V7.9c0-.9.4-1.6 1.7-1.6h1.6V3.4c-.3 0-1.3-.2-2.4-.2-2.5 0-4.1 1.5-4.1 4.2v2.4H7.7V13h2.7v8h3.2z"/></svg>'};
const ICO_CAL='<svg class="lg" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M3.5 10h17M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
function chipsFor(i){

      <div class="sec"><button class="textbtn" data-a="opentext" data-i="${i}"><span>✎ Description &amp; hashtags</span><span class="go">›</span></button></div>

function matches(i){
  const p=P(i), st=PLATS.map(x=>p.plat[x.k].st);
  if(filter==='todo') return !p.created;
  if(filter==='created') return p.created;
  if(filter==='draft') return st.includes('draft');
  if(filter==='sched') return st.includes('sched');
  if(filter==='posted') return st.includes('posted');

function renderStats(){

   `<div class="stat"><b>${created}/${total}</b><span>Created</span><div class="bar"><i style="width:${created/total*100}%"></i></div></div>`+

document.addEventListener('change', e=>{
  const t=e.target, a=t.dataset.a; if(!a) return; const i=+t.dataset.i;
  if(a==='slide'){ const p=P(i); p.slides[t.dataset.n]=t.checked; p.created=POSTS[i].s.every((_,k)=>p.slides[k]); save(); refreshCard(i); renderStats(); if(MODAL&&MODAL.i===i) renderModal() }
  if(a==='created'){ const p=P(i); p.created=t.checked; POSTS[i].s.forEach((_,k)=>p.slides[k]=t.checked); save(); refreshCard(i); renderStats(); if(MODAL&&MODAL.i===i) renderModal() }
  if(a==='pdate'){ P(i).plat[t.dataset.p].date=t.value; save(); refreshCard(i); renderStats() }

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-a]'); if(!t||t.tagName==='INPUT') return;

document.addEventListener('touchend',e=>{ if(tx===null||!MODAL) return; const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null;
  if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3) step(dx<0?1:-1) },{passive:true});
document.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('srow')){ e.preventDefault(); e.target.click() } });

/* ---------- settings: export / import ---------- */
const THEMES=[
 ['','Classic',['#FAF6F0','#FFFFFF','#D4587F','#B8893A']],
 ['slate','Slate blue',['#F1F5F9','#FFFFFF','#2563EB','#475569']],
 ['forest','Forest',['#F2F6F1','#FFFFFF','#3F6B4F','#7A6A2E']],
 ['lavender','Lavender',['#F6F4FC','#FFFFFF','#7C5CD6','#6B5FA0']],
 ['mono','Mono & orange',['#F6F5F3','#FFFFFF','#EA580C','#57534E']],
 ['midnight','Midnight',['#0F172A','#1E293B','#38BDF8','#94A3B8']]];
function curView(){ return S.view==='detail' ? 'detail' : 'badges' }
function curTheme(){ return S.theme===undefined ? 'slate' : S.theme }
function applyTheme(){ const t=curTheme(); if(t) document.documentElement.setAttribute('data-theme',t); else document.documentElement.removeAttribute('data-theme') }
let DM=null;
function syncLock(){ document.body.style.overflow=(MODAL||SET||DM!==null)?'hidden':'' }
function openText(i){ DM=i; document.getElementById('dmodal').hidden=false; syncLock(); renderDM() }
function closeText(){ if(DM!==null){ const i=DM; ['d','h'].forEach(k=>{ delete editing[k+i]; delete drafts[k+i] }); } DM=null; document.getElementById('dmodal').hidden=true; syncLock(); renderList() }
function afterBox(i){ if(DM===i) renderDM() }
function renderDM(){
  const i=DM, po=POSTS[i];
  document.getElementById('dcard').innerHTML=`<div class="mtop"><div><div class="mcar">${i+1}. ${esc(po.t)}</div><div class="mof">Description &amp; hashtags</div></div><button class="mx" data-a="tclose" aria-label="Close">✕</button></div>
   ${box(i,'d','Description')}${box(i,'h','Hashtags')}`;
}
document.addEventListener('keydown',e=>{ if(DM!==null&&e.key==='Escape') closeText() });
let SET=false, pendingImport=null, confirmReset=false, pasteVal='';
function exportText(){ return JSON.stringify(Object.assign({},S,{exportedAt:new Date().toISOString()}),null,1) }
function downloadBackup(){
  try{ const b=new Blob([exportText()],{type:'application/json'}); const a=document.createElement('a');
    a.href=URL.createObjectURL(b); a.download='unionvault-tracker-data-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('Downloading .json file…') }
  catch(_){ toast('Download not available here — use Copy data') } }
function openSettings(){ SET=true; pendingImport=null; confirmReset=false; document.getElementById('smodal').hidden=false; syncLock(); renderSettings() }
function closeSettings(){ SET=false; document.getElementById('smodal').hidden=true; syncLock() }
function summarise(o){ let c=0,pl=0,sl=0; Object.values(o.posts||{}).forEach(p=>{ if(p.created) c++; Object.values(p.slides||{}).forEach(v=>{ if(v) sl++ }); Object.values(p.plat||{}).forEach(x=>{ if(x&&x.st&&x.st!=='none') pl++ }) }); return `${c} carousels created, ${sl} slides ticked, ${pl} platform updates` }
function stageImport(text){
  try{ const o=JSON.parse(String(text).trim()); if(!o||typeof o.posts!=='object') throw 0; pendingImport=o; renderSettings() }
  catch(_){ pendingImport=null; renderSettings(); toast('That isn\'t tracker data — check you copied all of it') } }
function doImport(){ if(!pendingImport) return; const o=pendingImport; delete o.exportedAt; migrateData(o); S=o; S.posts=S.posts||{}; applyTheme(); save(); pendingImport=null; pasteVal=''; renderAll(); renderSettings(); autoPost(); toast('Data imported') }
function renderSettings(){
  document.getElementById('scard').innerHTML=`
   <div class="mtop"><div><div class="mcar">Sync &amp; backup</div><div class="mof">Settings</div></div><button class="mx" data-a="sclose" aria-label="Close">✕</button></div>
   <div class="ssec" style="margin-top:12px;padding-top:0;border:none"><h3>Colour theme</h3><div class="themes">${THEMES.map(t=>`<button class="theme ${curTheme()===t[0]?'on':''}" data-a="theme" data-v="${t[0]}"><span class="sw">${t[2].map(c=>`<i style="background:${c}"></i>`).join('')}</span>${t[1]}</button>`).join('')}</div></div>
   <div class="ssec"><h3>Platform status view</h3><div class="themes" style="grid-template-columns:1fr 1fr">
     <button class="theme ${curView()==='badges'?'on':''}" data-a="view" data-v="badges"><span style="display:flex;gap:4px"><span class="chip posted">${LOGO.tt}✓</span><span class="chip sched">${LOGO.ig}${ICO_CAL}</span></span>Badges on top<span style="font-weight:400;color:var(--muted);font-size:10.5px">Quick TT / IG / FB badges in the header, full wording inside</span></button>
     <button class="theme ${curView()==='detail'?'on':''}" data-a="view" data-v="detail"><span style="display:flex;gap:4px"><span class="chip">To create · 2/6</span></span>Details only<span style="font-weight:400;color:var(--muted);font-size:10.5px">Header shows progress only; status sits in the Posted or scheduled bar</span></button>
   </div></div>
   <div class="ssec"><h3>Export data</h3><p>Everything you've ticked, scheduled and edited. Use it to move your progress to another device.</p>
     <div class="btns"><button class="btn save" data-a="sexcopy">Copy data</button><button class="btn edit" data-a="sexdl">Download .json file</button></div>
     <textarea readonly rows="3" onfocus="this.select()">${esc(exportText())}</textarea></div>
   <div class="ssec"><h3>Import data</h3><p>Choose an exported .json file, or paste the copied data below. <b>This replaces what's on this device.</b></p>
     <div class="btns"><button class="btn edit" data-a="sfile">Choose .json file</button></div>
     <textarea id="spaste" rows="3" placeholder="…or paste exported data here" style="margin-top:8px">${esc(pasteVal)}</textarea>
     <div class="btns"><button class="btn save" data-a="simport">Import pasted data</button></div>
     ${pendingImport?`<div class="sconf"><b>Ready to import:</b> ${summarise(pendingImport)}.<br>This will replace the data on this device.<div class="btns"><button class="btn save" data-a="sdoimport">Replace my data</button><button class="btn lnk" data-a="scancel">Cancel</button></div></div>`:''}</div>
   <div class="ssec"><h3>Reset</h3>${confirmReset?`<div class="sconf">Clear every tick, date and edited text on this device? This can't be undone.<div class="btns"><button class="btn save" data-a="sdoreset">Yes, clear everything</button><button class="btn lnk" data-a="scancel">Cancel</button></div></div>`
     :`<button class="ghost" data-a="sreset">Reset everything</button>`}</div>`;
}
document.addEventListener('input',e=>{ if(e.target.id==='spaste') pasteVal=e.target.value });
document.getElementById('sfile').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>stageImport(r.result); r.readAsText(f); e.target.value='' };
document.addEventListener('keydown',e=>{ if(SET&&e.key==='Escape') closeSettings() });

/* ---------- auto-mark scheduled posts as posted ---------- */
function autoPost(){
  const now=new Date(); let n=0;
  POSTS.forEach((_,i)=>{ const p=P(i); PLATS.forEach(x=>{ const pl=p.plat[x.k];
    if(pl.st==='sched'&&pl.date){ const when=new Date(pl.date+'T'+(pl.time||'23:59')); if(when<=now){ pl.st='posted'; pl.time=''; n++ } } }) });
  if(n){ save(); renderAll(); toast(n+' scheduled post'+(n>1?'s':'')+' marked as posted') }
}
applyTheme();
renderAll();
autoPost(); setInterval(autoPost,30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) autoPost() });
</script>
</body>
</html>
